reviewer_rationale: "PXD007535 is retained as a scientifically interesting but provenance-insufficient negative benchmark case. Public evidence establishes cohort-level counts and one technical Run-to-Sample-file edge, but no authoritative Sample-to-Subject mapping was found and 66 versus 67 remains unexplained. This is not a scientific failure; it is a failure to meet the current evidence-chain requirement for Benchmark v1."
