name: OysterBox validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run OysterBox tests
        run: python -m unittest discover -s tests -v
      - name: Run transparent readiness scoring smoke test
        run: PYTHONPATH=. python3 scoring/validation_readiness.py
