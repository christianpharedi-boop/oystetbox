[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oysterbox"
version = "0.1.0"
description = "A provenance-first proteomics transfer experiment derived from CoreSignal."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Basie Pharedi" }]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".git", ".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
